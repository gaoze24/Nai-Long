<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Nai-Long Character Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="app-frame" aria-label="Character player app">
        <section class="media-stage" aria-live="polite">
          <div class="video-wrap" id="videoWrap">
            <video
              id="characterVideo"
              class="character-video"
              preload="metadata"
              playsinline
              webkit-playsinline
              aria-label="Character video"
            >
              Your browser does not support HTML5 video.
            </video>

            <div class="media-overlay" id="loadingOverlay" role="status" aria-live="polite">
              <span class="spinner" aria-hidden="true"></span>
              <span class="overlay-text" id="loadingText">Loading media...</span>
            </div>

            <p class="media-error" id="errorMessage" role="alert" hidden>
              Unable to load media. Check your files in ./assets and try again.
            </p>
          </div>
        </section>

        <footer class="controls-row">
          <button
            id="playButton"
            class="control-button play-button"
            type="button"
            aria-pressed="false"
            aria-label="Play media"
          >
            <span class="icon-stack" aria-hidden="true">
              <span class="icon-play"></span>
              <span class="icon-pause"><span></span><span></span></span>
            </span>
            <span id="playButtonLabel">Play</span>
          </button>
        </footer>
      </section>
    </main>

    <audio id="characterAudio" preload="metadata"></audio>

    <script src="./app.js" defer></script>
  </body>
</html>
