<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Nai-Long Character Player</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="app-frame" aria-label="Character player app">
        <header class="top-bar">
          <h1 class="app-title">Character Player</h1>
          <p class="app-subtitle">Tap play to begin</p>
        </header>

        <section class="media-stage" aria-live="polite">
          <div class="video-wrap" id="videoWrap">
            <video
              id="characterVideo"
              class="character-video"
              preload="metadata"
              playsinline
              webkit-playsinline
              aria-label="Character video"
            >
              Your browser does not support HTML5 video.
            </video>

            <div class="media-overlay" id="loadingOverlay" role="status" aria-live="polite">
              <span class="spinner" aria-hidden="true"></span>
              <span class="overlay-text" id="loadingText">Loading media...</span>
            </div>

            <p class="media-error" id="errorMessage" role="alert" hidden>
              Unable to load media. Check your files in ./assets and try again.
            </p>
          </div>
        </section>

        <footer class="controls-row">
          <button
            id="playButton"
            class="control-button play-button"
            type="button"
            aria-pressed="false"
            aria-label="Play media"
          >
            <span class="icon-stack" aria-hidden="true">
              <span class="icon-play"></span>
              <span class="icon-pause"><span></span><span></span></span>
            </span>
            <span id="playButtonLabel">Play</span>
          </button>

          <button
            id="settingsButton"
            class="control-button settings-button"
            type="button"
            aria-label="Open settings"
          >
            <span class="settings-glyph" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </button>
        </footer>

        <p id="statusMessage" class="status-message" aria-live="polite">Loading media...</p>
      </section>
    </main>

    <section id="settingsModal" class="settings-modal" hidden>
      <button
        id="modalBackdrop"
        class="modal-backdrop"
        type="button"
        aria-label="Close settings"
      ></button>

      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
      >
        <header class="modal-header">
          <h2 id="settingsTitle">Settings</h2>
          <button
            id="closeSettingsButton"
            class="close-settings"
            type="button"
            aria-label="Close settings"
          >
            Close
          </button>
        </header>

        <label class="setting-item switch-item" for="externalAudioToggle">
          <span>Use separate audio track</span>
          <input id="externalAudioToggle" type="checkbox" />
        </label>

        <label class="setting-item" for="rateSelect">
          <span>Playback speed</span>
          <select id="rateSelect">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
        </label>

        <label class="setting-item" for="volumeSlider">
          <span>Volume</span>
          <input
            id="volumeSlider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </label>
      </div>
    </section>

    <audio id="characterAudio" preload="metadata"></audio>

    <script src="./app.js" defer></script>
  </body>
</html>
